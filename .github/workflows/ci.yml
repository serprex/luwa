name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # build scripts run as `lua`, so install Lua 5.5 from source
      - name: install lua
        run: |
          curl -sSfL https://www.lua.org/ftp/lua-5.5.1.tar.gz | tar xz
          make -C lua-5.5.1 linux
          sudo make -C lua-5.5.1 install
          lua -v

      - name: install ninja
        run: sudo apt-get install -y ninja-build

      - name: build
        run: ninja

      - name: test
        run: node scripts/test.js

      - name: make.lua gc test
        run: node scripts/maketest.js

      - name: bootstrap
        run: ./scripts/bootstrap.sh

      # copy the files index.html needs into one folder for github pages
      - name: pages bundle
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: mkdir _site && cp index.html ui.js rt.js util.js rt.wasm _site/

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'

  pages:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
